<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="t d">
<title id="t">attendRevolution</title>
<desc id="d">QR-Based Proxy-Free Attendance System for FET UOS</desc>
<style>@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}
